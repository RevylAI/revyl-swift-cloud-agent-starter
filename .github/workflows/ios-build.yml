name: iOS - Build

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "ios/**"
      - ".agents/**"
      - "AGENTS.md"

concurrency:
  group: ios-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      REVYL_ALLOW_XCODE_VERSION_MISMATCH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build simulator app
        working-directory: ios
        run: |
          bash .revyl/setup-ios-remote.sh
          bash .revyl/build-ios-remote.sh

      - name: Upload to Revyl
        if: ${{ success() && vars.REVYL_APP_ID != '' }}
        env:
          REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
          REVYL_APP_ID: ${{ vars.REVYL_APP_ID }}
        run: |
          if [[ -z "${REVYL_API_KEY:-}" ]]; then
            echo "REVYL_API_KEY is not set; skipping Revyl fallback upload."
            exit 0
          fi
          REVYL_NO_MODIFY_PATH=1 sh -c 'curl -fsSL https://revyl.com/install.sh | sh'
          export PATH="$HOME/.revyl/bin:$PATH"
          revyl auth login --token "$REVYL_API_KEY"
          revyl build upload \
            --file ios/build/RevylSwiftDemo.app.zip \
            --app "$REVYL_APP_ID" \
            --platform ios \
            --version "$GITHUB_SHA" \
            --yes \
            --json
