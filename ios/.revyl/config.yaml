project:
  name: RevylSwiftDemo-ios
  org_id: REPLACE_WITH_REVYL_ORG_ID

defaults:
  timeout: 1800

build:
  system: Xcode
  platforms:
    ios:
      app_id: REPLACE_WITH_REVYL_APP_ID
      scheme: RevylSwiftDemo
      setup: bash .revyl/setup-ios-remote.sh
      command: bash .revyl/build-ios-remote.sh
      output: build/RevylSwiftDemo.app.zip
      keep_derived_data: true

pr_review:
  enabled: true
  skip_drafts: true
  actions:
    preview_link: true
    proof_of_changes: true
  builds:
    ios:
      enabled: true
      framework: native_ios
      app: RevylSwiftDemo-ios
      root_dir: ios
      build_command: |
        REVYL_ALLOW_XCODE_VERSION_MISMATCH=1 bash -lc 'set -euo pipefail; log(){ printf "[revyl-setup] %s\n" "$*"; }; expected=""; if [[ -f .xcode-version ]]; then expected="$(tr -d "[:space:]" < .xcode-version)"; elif [[ -f ../.xcode-version ]]; then expected="$(tr -d "[:space:]" < ../.xcode-version)"; fi; if [[ -n "$expected" ]]; then active="$(xcodebuild -version | sed -n "s/^Xcode //p")"; if [[ "$active" != "$expected" ]]; then selected=""; for candidate in /Applications/Xcode*.app; do [[ -d "$candidate" ]] || continue; version="$(DEVELOPER_DIR="$candidate/Contents/Developer" xcodebuild -version 2>/dev/null | sed -n "s/^Xcode //p" || true)"; if [[ "$version" == "$expected" ]]; then selected="$candidate/Contents/Developer"; break; fi; done; if [[ -n "$selected" ]]; then export DEVELOPER_DIR="$selected"; log "Selected Xcode $expected."; elif [[ "${REVYL_ALLOW_XCODE_VERSION_MISMATCH:-}" == "1" ]]; then log "Expected Xcode $expected but active Xcode is $active; continuing."; else printf "Expected Xcode %s but active Xcode is %s. Set REVYL_ALLOW_XCODE_VERSION_MISMATCH=1 to continue.\n" "$expected" "$active" >&2; exit 1; fi; else log "Active Xcode matches .xcode-version ($expected)."; fi; else log "No .xcode-version found; using active Xcode."; fi; if command -v xcodegen >/dev/null 2>&1; then xcodegen --version >/dev/null; elif command -v mint >/dev/null 2>&1; then mint run yonaskolb/XcodeGen@2.43.0 xcodegen --version >/dev/null; elif command -v brew >/dev/null 2>&1; then log "Installing XcodeGen with Homebrew."; brew install xcodegen; xcodegen --version >/dev/null; else printf "XcodeGen is required. Install it with brew install xcodegen or install Mint.\n" >&2; exit 1; fi; log "Setup complete."'
        REVYL_ALLOW_XCODE_VERSION_MISMATCH=1 bash .revyl/build-ios-remote.sh
      artifact_path: build/RevylSwiftDemo.app.zip
      caches:
        - key: revyl-swift-demo-ios-derived-data
          paths:
            - build/DerivedData
